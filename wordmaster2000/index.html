<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>본잉글리시 수능 2000 어휘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Literata:opsz,wght@7..72,400;7..72,600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one study column; sticky mode tabs; each mode is a self-contained panel */
:root {
  --bg: #f6f6ef; --paper: #ffffff; --ink: #2a2a22; --muted: #6c6a5e; --line: #e0e0d3;
  --brand: #7E8A2A; --brand-dark: #667022; --brown: #736357;
  --ko: #736357; --accent: #667022; --chip: #edeedf; --ok: #2e8b57; --bad: #c8453b;
  --green: #2E8B57; --red: #d32f2f;
  --f-en: 'Literata', Georgia, serif; --f-ko: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; --f-head: 'Gowun Batang', 'Noto Serif KR', serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #191a14; --paper: #23241c; --ink: #eceadf; --muted: #a8a698; --line: #38392c; --brand: #B3C050; --brand-dark: #667022; --brown: #CDBDAF; --ko: #CDBDAF; --accent: #B3C050; --chip: #2f3024; --ok: #5cc98d; --bad: #ff7b6e; --green: #4fbf7f; --red: #ff6b6b; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #191a14; --paper: #23241c; --ink: #eceadf; --muted: #a8a698; --line: #38392c; --brand: #B3C050; --brand-dark: #667022; --brown: #CDBDAF; --ko: #CDBDAF; --accent: #B3C050; --chip: #2f3024; --ok: #5cc98d; --bad: #ff7b6e; --green: #4fbf7f; --red: #ff6b6b; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ko); margin: 0; }
.wrap { max-width: 820px; margin: 0 auto; padding-inline: 18px; padding-block: 26px 20px; }
h1 { font-family: var(--f-head); font-size: 1.6rem; margin: 0 0 4px; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); font-size: .9rem; }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 6px; flex-wrap: wrap; padding-block: 12px; margin-top: 12px; border-bottom: 1px solid var(--line); }
button { font: 500 .92rem var(--f-ko); color: var(--ink); cursor: pointer; }
.tab, .pill { border: 1px solid var(--line); background: var(--paper); padding: 7px 14px; border-radius: 999px; }
.tab[aria-selected="true"] { background: var(--brand-dark); color: #fff; border-color: var(--brand-dark); }
.pill[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 18px 0 10px; }
.tools .sp { flex: 1; }
.count { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
h3 { font-size: .9rem; color: var(--accent); margin: 22px 0 8px; letter-spacing: .02em; }
.list { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; }
.item { display: grid; grid-template-columns: 2.2em minmax(7em, 13em) minmax(0, 1fr) 2em; gap: 10px; align-items: baseline; padding: 11px 14px; border-bottom: 1px dashed var(--line); }
.item:last-child { border-bottom: none; }
.n { color: var(--muted); font-size: .78rem; text-align: right; font-variant-numeric: tabular-nums; }
.w { font: 600 1.05rem var(--f-en); }
.item.ph .w { color: var(--ko); }
.m { font-size: .9rem; line-height: 1.6; min-width: 0; }
.ps { display: inline-block; font-size: .7rem; color: var(--paper); background: var(--muted); border-radius: 4px; padding: 0 4px; margin-right: 3px; vertical-align: 1px; }
.star { background: none; border: none; font-size: 1.1rem; color: var(--line); padding: 0; }
.star[aria-pressed="true"] { color: var(--accent); }
body.hideM .m span.txt { color: transparent; border-bottom: 1px dotted var(--muted); }
body.hideM .item.peek .m span.txt { color: inherit; border-bottom-color: transparent; }
body.hideW .w { color: transparent !important; border-bottom: 1px dotted var(--muted); }
body.hideW .item.peek .w { color: inherit !important; border-bottom-color: transparent; }
body.hideM .item, body.hideW .item { cursor: pointer; }
/* flashcard */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 28px 22px; cursor: pointer; user-select: none; }
.card .big { font: 600 2.1rem var(--f-en); }
.card .sub { margin-top: 14px; font-size: 1rem; line-height: 1.7; color: var(--ko); }
.card .tip { margin-top: 18px; font-size: .78rem; color: var(--muted); }
.nav { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.nav button { border: 1px solid var(--line); background: var(--paper); padding: 9px 18px; border-radius: 8px; }
.nav .know { border-color: var(--ok); color: var(--ok); } .nav .again { border-color: var(--bad); color: var(--bad); }
.prog { height: 6px; background: var(--chip); border-radius: 3px; overflow: hidden; margin-top: 12px; }
.prog i { display: block; height: 100%; background: var(--accent); }
/* quiz */
.q { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.q .ask { font-size: .82rem; color: var(--muted); margin-bottom: 6px; }
.q .stem { font: 600 1.6rem var(--f-en); margin-bottom: 16px; line-height: 1.4; }
.q .stem.ko { font: 500 1.15rem var(--f-ko); }
.q .stem.def { font: 400 1.15rem var(--f-en); }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--bg); padding: 11px 14px; border-radius: 10px; line-height: 1.5; }
.opt.en { font-family: var(--f-en); font-size: 1.05rem; }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--paper)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--paper)); }
.fb { min-height: 1.6em; margin-top: 12px; font-size: .92rem; }
.fb.ok { color: var(--ok); } .fb.bad { color: var(--bad); }
.score { display: flex; gap: 14px; flex-wrap: wrap; font-size: .9rem; color: var(--muted); margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.score b { color: var(--ink); }
.done { text-align: center; padding: 30px 10px; }
.done .big { font: 700 2.4rem var(--f-head); color: var(--accent); }
.miss { text-align: left; margin-top: 16px; font-size: .9rem; line-height: 1.8; }
.spk { display: inline-flex; align-items: center; justify-content: center; gap: 4px; width: 2em; height: 2em; border-radius: 50%; border: 1px solid var(--line); background: var(--chip); color: var(--ko) !important; padding: 0; vertical-align: middle; margin-left: 6px; font-size: .8rem; }
.spk svg { width: 1.05em; height: 1.05em; fill: currentColor; }
.spk.wide { width: auto; border-radius: 999px; padding: 0 12px; font: 500 .85rem var(--f-ko); }
.spk.big { width: 2.6em; height: 2.6em; font-size: 1rem; margin: 10px 0 0; }
.opt.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--paper)); }
.primary:disabled { opacity: .4; cursor: default; }
.nosound { font-size: .8rem; color: var(--bad); }
.primary { background: var(--brand-dark); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; margin-top: 14px; }
/* spelling */
.spell input { width: 100%; font: 500 1.15rem var(--f-en); padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.hint { font: 400 1rem var(--f-en); color: var(--muted); letter-spacing: .12em; margin-bottom: 10px; }
.tp { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 6px 20px 20px; }
.tp h3 { margin-top: 20px; }
.tq { padding: 14px 0; border-bottom: 1px dashed var(--line); }
.tq:last-of-type { border-bottom: none; }
.tq .qh { display: flex; gap: 8px; align-items: baseline; line-height: 1.6; }
.tq .qn { font-weight: 700; color: var(--accent); min-width: 1.8em; font-variant-numeric: tabular-nums; }
.tq .qt { min-width: 0; }
.tq .qt .en { font: 600 1.08rem var(--f-en); }
.tq .qt .def { font-family: var(--f-en); font-style: italic; }
.tq .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin: 8px 0 0 2.6em; }
.tq label.ch { display: flex; gap: 6px; align-items: baseline; cursor: pointer; line-height: 1.5; padding: 4px 6px; border-radius: 6px; }
.tq label.ch.en { font-family: var(--f-en); }
.tq label.ch.right { background: color-mix(in srgb, var(--ok) 16%, var(--paper)); }
.tq label.ch.wrong { background: color-mix(in srgb, var(--bad) 14%, var(--paper)); text-decoration: line-through; }
.tq .wr { margin: 8px 0 0 2.6em; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tq .wr input { flex: 1; min-width: 0; font: 500 1.05rem var(--f-en); padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.tq .wr .hint { margin: 0; font-size: .9rem; }
.ick { padding: 7px 14px !important; font-size: .85rem !important; }
.ick:disabled { opacity: .45; cursor: default; }
.tq .res { margin: 8px 0 0 2.6em; font-size: .9rem; }
.tq .res.ok { color: var(--ok); } .tq .res.bad { color: var(--bad); }
.tq .mk { font-weight: 700; margin-right: 4px; }
.tq.ok .qn::after { content: ' O'; color: var(--ok); } .tq.bad .qn::after { content: ' X'; color: var(--bad); }
.thead { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 16px 0 10px; }
.thead input { font: 500 .95rem var(--f-ko); padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); width: 11em; }
.tbig { text-align: center; padding: 18px 10px 6px; }
.tbig .sc { font: 700 2.6rem var(--f-head); color: var(--accent); }
.tbtns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.tbtns .primary { margin-top: 0; }
.ghost { border: 1px solid var(--line); background: var(--paper); padding: 10px 18px; border-radius: 8px; }
@media (max-width: 560px) { .tq .choices { grid-template-columns: 1fr; margin-left: 0; } .tq .wr, .tq .res { margin-left: 0; } }
h1, .lead { word-break: keep-all; }
.dl { font-weight: 500; }
#dayr { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:14px; font-size:.92rem; }
footer { text-align: center; padding-block: 34px 10px; font-weight: 700; color: var(--brand); font-size: .95rem; }
footer b { color: var(--brown); }
@media (max-width: 560px) {
  .item { grid-template-columns: 1.8em minmax(0,1fr) 1.6em; }
  .item .m { grid-column: 2 / 3; }
  .item .star { grid-column: 3; grid-row: 1; }
  .card .big { font-size: 1.7rem; }
  .q .stem { font-size: 1.35rem; }
}
@media (prefers-reduced-motion: no-preference) { .opt, .card { transition: background .15s, border-color .15s; } }

/* ===== 모바일 보정 ===== */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, label, select, .card, .item { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.w, .m, .qt, .opt, .fb, .res, .miss, .stem, .big, .sub, .hint, label.ch { overflow-wrap: anywhere; }
/* color-mix 미지원 구형 브라우저에서도 정답·오답 색이 보이도록 */
@supports not (background: color-mix(in srgb, red 10%, white)) {
  .opt.right, .tq label.ch.right { background: rgba(46,139,87,.18); }
  .opt.wrong, .tq label.ch.wrong { background: rgba(200,69,59,.16); }
  .opt.sel { background: rgba(126,138,42,.16); }
}
@media (max-width: 560px) {
  .wrap { padding-inline: 14px; padding-block: 18px 16px; }
  h1 { font-size: 1.32rem; line-height: 1.3; }
  .lead { font-size: .8rem; line-height: 1.5; margin-top: 4px; }
  #dayr { margin-top: 10px; gap: 6px; }
  /* 탭: 3줄로 쌓이며 화면을 가리지 않도록 한 줄 가로 스크롤 */
  .bar { flex-wrap: nowrap; overflow-x: auto; margin-inline: -14px; padding: 8px 14px; margin-top: 8px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .bar::-webkit-scrollbar { display: none; }
  .tab { flex: none; white-space: nowrap; padding: 8px 13px; font-size: .88rem; }
  .tools { margin: 12px 0 8px; }
  .tools .sp { display: none; }
  .pill { padding: 8px 12px; font-size: .84rem; min-height: 38px; }
  .item { gap: 2px 8px; padding: 10px 6px 10px 8px; align-items: start; }
  .item .n { padding-top: 5px; }
  .item .star { width: 40px; height: 40px; margin: -6px -4px 0 0; font-size: 1.25rem; }
  .item { grid-template-columns: 1.9em minmax(0,1fr) 36px; }
  .spk { width: 34px; height: 34px; font-size: .85rem; }
  .spk.wide { width: auto; }
  .spk.big { width: 44px; height: 44px; }
  .card { min-height: 220px; padding: 22px 16px; }
  .nav { display: grid; grid-template-columns: 1fr 1fr; }
  .nav button { padding: 12px 8px; min-height: 46px; }
  .q { padding: 16px 14px; }
  .q .stem.ko, .q .stem.def { font-size: 1.05rem; line-height: 1.55; }
  .opt { padding: 12px; min-height: 46px; }
  .primary { width: 100%; padding: 13px 16px; }
  .ghost { padding: 12px 16px; }
  .tp { padding: 2px 12px 14px; }
  .tq .qh { flex-wrap: nowrap; gap: 6px; }
  .tq label.ch { padding: 9px 8px; min-height: 42px; }
  .tq .choices { gap: 2px; }
  /* 16px 미만 입력칸은 아이폰에서 누를 때 화면이 확대되므로 16px 이상 유지 */
  .thead { gap: 8px; }
  .thead input { font-size: 16px; flex: 1 1 8em; min-width: 0; min-height: 42px; }
  .thead .count:last-child { flex-basis: 100%; line-height: 1.55; }
  .tq .wr .hint { flex-basis: 100%; }
  .tq .wr input { flex: 1 1 100%; min-height: 44px; }
  .ick { flex: 1 1 100%; min-height: 42px; }
  .tbtns { display: grid; grid-template-columns: 1fr; }
  .tbtns > * { width: 100%; }
  .spell input { min-height: 46px; }
  .hint { letter-spacing: .08em; }
}
/* 가로로 돌린 휴대폰·태블릿 */
@media (pointer: coarse) {
  .thead input { font-size: 16px; }
  .spk { width: 34px; height: 34px; }
  .spk.wide { width: auto; height: 36px; }
  .star { min-width: 36px; min-height: 36px; }
}
/* 브랜드 표기 */
.brandmark { display: flex; flex-direction: column; margin-bottom: 12px; line-height: 1.15; font-family: Georgia, 'Times New Roman', serif; }
.bm { font-size: 1.15rem; } .bm b { color: var(--brand); } .bm i { color: var(--brown); font-style: normal; }
.bs { font-size: .66rem; letter-spacing: .08em; color: var(--muted); margin-top: 2px; }
/* 학습 범위: 휴대폰 기본 드롭다운 대신 직접 누르는 DAY 판 */
#dayb { font: 700 1rem var(--f-ko); min-height: 44px; padding: 8px 14px; border: 1px solid var(--brand); border-radius: 10px; background: var(--paper); color: var(--ink); font-variant-numeric: tabular-nums; }
#dayb .dv { color: var(--brand); }
#dayb[aria-expanded="true"] .dv { display: inline-block; transform: rotate(180deg); }
#dayp { margin-top: 10px; padding: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; }
#dayp[hidden] { display: none; }
#dayh { margin: 0 0 10px; font-size: .88rem; font-weight: 500; color: var(--accent); }
#dayg { display: grid; grid-template-columns: repeat(10, minmax(0,1fr)); gap: 5px; }
#dayg button { min-height: 42px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font: 600 .92rem var(--f-ko); font-variant-numeric: tabular-nums; }
#dayg button.in { background: var(--chip); border-color: var(--brand); }
#dayg button.end { background: var(--brand-dark); border-color: var(--brand-dark); color: #fff; }
.dayf { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; }
.dayf .primary { margin: 0; width: auto; padding: 10px 26px; }
@media (max-width: 560px) { #dayg { grid-template-columns: repeat(5, minmax(0,1fr)); } }
</style>
</head>
<body>

<div class="wrap">
  <div class="brandmark" aria-label="Born English Language Training Center"><span class="bm"><b>Born</b> <i>English</i></span><span class="bs">Language Training Center</span></div>
  <h1>WORD MASTER 수능 2000 핵심 어휘</h1>
  <p class="lead">No.1 · DAY 01~50 · 단어 2,000개 · 동의어·반의어·영영풀이 포함</p>
  <div id="dayr"><span class="dl">학습 범위</span><button type="button" id="dayb" aria-expanded="false" aria-controls="dayp"><span id="dayt"></span> <span class="dv" aria-hidden="true">▾</span></button><span class="count" id="dc"></span></div>
  <div id="dayp" hidden><p id="dayh"></p><div id="dayg"></div><div class="dayf"><button type="button" class="pill" id="daya">전체 DAY 01~50</button><button type="button" class="primary" id="dayd">완료</button></div></div>
  <div class="bar" role="tablist">
    <button class="tab" role="tab" id="t-list" data-m="list">단어장</button>
    <button class="tab" role="tab" id="t-card" data-m="card">플래시카드</button>
    <button class="tab" role="tab" id="t-quiz" data-m="quiz">뜻 고르기</button>
    <button class="tab" role="tab" id="t-ee" data-m="ee">영영풀이</button>
    <button class="tab" role="tab" id="t-spell" data-m="spell">철자 쓰기</button>
    <button class="tab" role="tab" id="t-self" data-m="self">셀프 테스트</button>
    <button class="tab" role="tab" id="t-test" data-m="test">실전 테스트</button>
  </div>
  <main id="main"></main>
  <footer>Slow and steady wins the race. <b>- 본잉글리시</b></footer>

const ALLW = DATA.W.map((x,i)=>({...x, i, core: core(x.m)}));
let W = ALLW, E = DATA.E;
function core(m){ return m.replace(/\s*\([^)]*\)/g,'').replace(/\s+/g,' ').trim(); }
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fmt = m => esc(m);
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const store = { get(k,d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
let stars = new Set(store.get('stars', []));
const saveStars = () => store.set('stars', [...stars]);
const main = document.getElementById('main');
const synth = window.speechSynthesis || null;
let voice = null, slow = store.get('slow', false);
function pickVoice(){ if (!synth) return; const vs = synth.getVoices(); voice = vs.find(v => /en[-_]US/i.test(v.lang) && /Google|Samantha|Microsoft|Natural/i.test(v.name)) || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; }
if (synth){ pickVoice(); synth.onvoiceschanged = pickVoice; }
function say(t){
  if (!synth){ alertNoSound(); return; }
  synth.cancel();
  const u = new SpeechSynthesisUtterance(t.replace(/~/g,' ').replace(/\s+/g,' ').trim());
  u.lang = 'en-US'; if (voice) u.voice = voice; u.rate = slow ? 0.65 : 0.9; synth.speak(u);
}
function alertNoSound(){ const f = document.getElementById('fb') || main; const p = document.createElement('p'); p.className = 'nosound'; p.textContent = '이 브라우저에서는 음성 읽기를 지원하지 않습니다. 크롬이나 사파리에서 열어 주세요.'; f.appendChild(p); }
let actx = null;
function dingdong(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + 0.02;
    [[1318.5, 0], [1046.5, 0.32]].forEach(([f, d]) => {
      [1, 2.01].forEach((m, k) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = f * m;
        const peak = k ? 0.06 : 0.28, st = t0 + d;
        g.gain.setValueAtTime(0.0001, st);
        g.gain.exponentialRampToValueAtTime(peak, st + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, st + 0.9);
        o.connect(g).connect(actx.destination); o.start(st); o.stop(st + 0.95);
      });
    });
  } catch(e) {}
}
const ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
const spk = (t, cls='', label='') => `<button type="button" class="spk ${cls}" data-say="${esc(t)}" aria-label="${esc(t)} 발음 듣기">${ICON}${label}</button>`;
document.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b){ e.preventDefault(); e.stopPropagation(); say(b.dataset.say); } }, true);
let scope = 'all'; // all | word | phrase | star
function pool(){ return W.filter(x => scope==='all' || (scope==='word' && !x.p) || (scope==='phrase' && x.p) || (scope==='star' && stars.has(x.i))); }
function scopeBar(extra=''){
  const opt = (v,l) => `<button class="pill" data-scope="${v}" aria-pressed="${scope===v}">${l}</button>`;
  return `<div class="tools">${opt('all','전체')}${opt('star','★ 표시만')}<span class="sp"></span>${extra}</div>`;
}
function bindScope(fn){ main.querySelectorAll('[data-scope]').forEach(b => b.onclick = () => { scope = b.dataset.scope; fn(); }); }

/* 단어장 */
let hideM = false, hideW = false;
function list(){
  const p = pool();
  let h = scopeBar(`<button class="pill" id="hm" aria-pressed="${hideM}">뜻 가리기</button><button class="pill" id="hw" aria-pressed="${hideW}">영어 가리기</button>${hideM||hideW ? '<button class="pill" id="pa">정답 모두 확인</button>' : ''}<button class="pill" id="sl" aria-pressed="${slow}">천천히 읽기</button>`);
  h += `<p class="count">${p.length}개 · ★를 누르면 헷갈리는 단어로 표시됩니다${hideM||hideW ? ' · 줄을 누르면 가린 부분이 보입니다' : ''}</p>`;
  if (!p.length) h += `<p class="count">★ 표시한 단어가 아직 없습니다. 단어 오른쪽 ☆를 눌러 표시해 보세요.</p>`;
  let sec = '';
  p.forEach(x => {
    if (x.s !== sec){ if (sec) h += '</div>'; sec = x.s; h += `<h3>${esc(sec)}</h3><div class="list">`; }
    h += `<div class="item${x.p?' ph':''}" data-i="${x.i}"><span class="n">${x.i+1}</span><span class="w">${esc(x.w)}${spk(x.w)}</span><span class="m"><span class="txt">${fmt(x.m)}</span></span><button class="star" data-star="${x.i}" aria-pressed="${stars.has(x.i)}" aria-label="헷갈리는 단어 표시">${stars.has(x.i)?'★':'☆'}</button></div>`;
  });
  if (sec) h += '</div>';
  main.innerHTML = h;
  bindScope(list);
  document.getElementById('hm').onclick = () => { hideM = !hideM; document.body.classList.toggle('hideM', hideM); list(); };
  document.getElementById('hw').onclick = () => { hideW = !hideW; document.body.classList.toggle('hideW', hideW); list(); };
  main.querySelectorAll('.item').forEach(r => r.onclick = e => { if (e.target.closest('.star')) return; r.classList.toggle('peek'); });
  const pa = document.getElementById('pa'); if (pa) pa.onclick = () => { const items = [...main.querySelectorAll('.item')]; const all = items.every(i => i.classList.contains('peek')); items.forEach(i => i.classList.toggle('peek', !all)); pa.textContent = all ? '정답 모두 확인' : '다시 가리기'; };
  document.getElementById('sl').onclick = () => { slow = !slow; store.set('slow', slow); list(); };
  main.querySelectorAll('[data-star]').forEach(b => b.onclick = () => { const i = +b.dataset.star; stars.has(i) ? stars.delete(i) : stars.add(i); saveStars(); b.setAttribute('aria-pressed', stars.has(i)); b.textContent = stars.has(i)?'★':'☆'; });
}

let deck = [], di = 0, flipped = false, front = 'en';
function cardStart(){ deck = shuffle(pool()); di = 0; flipped = false; card(); }
function card(){
  let h = scopeBar(`<button class="pill" id="fr" aria-pressed="${front==='ko'}">우리말 먼저</button><button class="pill" id="sh">다시 섞기</button>`);
  if (!deck.length){ main.innerHTML = h + `<p class="count">카드가 없습니다. ★ 표시한 단어가 없으면 '전체'를 고르세요.</p>`; bindCard(); return; }
  if (di >= deck.length){
    main.innerHTML = h + `<div class="card"><div class="big">끝!</div><div class="sub">${deck.length}장을 모두 넘겼습니다.<br>모르는 카드는 ★로 표시해 두었습니다.</div></div><div class="nav"><button id="again">처음부터</button></div>`;
    bindCard(); document.getElementById('again').onclick = cardStart; return;
  }
  const x = deck[di];
  const a = front==='en' ? `<div class="big">${esc(x.w)}</div>${spk(x.w,'big')}` : `<div class="sub" style="font-size:1.2rem;color:var(--ink)">${fmt(x.m)}</div>`;

  let mc = [], sa = [];
  if (kind === 'self' || kind === 'mcall') mc = shuffle(W).map(mcWord).concat(shuffle(E).map(mcDef));
  if (kind === 'self' || kind === 'saall') sa = shuffle(W).map(x => ({ t:'write', x })).concat(shuffle(E).map(e => ({ t:'defw', x:e })));
  if (kind === 'mini'){

    const used = new Set(); const take = (arr, n) => { const out = []; for (const x of arr){ if (out.length>=n) break; if (!used.has(x.w)){ used.add(x.w); out.push(x); } } return out; };
    const p1 = take(phr, 2); take(words, 6 - p1.length).concat(p1).forEach(x => mc.push(mcWord(x)));

  if (!good && !isE) stars.add(x.i);
  return good;
}
function selfCheck(t, k){
  const key = t + k; if (T.checked.has(key)) return;
  if (t === 'm' && !main.querySelector(`input[name="m${k}"]:checked`)){ document.getElementById('mr'+k).innerHTML = '<span class="count">보기를 먼저 고르세요.</span>'; return; }
  if (t === 's' && !document.getElementById('s'+k).value.trim()){ document.getElementById('sr'+k).innerHTML = '<span class="count">답을 먼저 쓰세요.</span>'; return; }
  const good = t === 'm' ? markMC(k) : markSA(k);
  T.checked.add(key); if (good){ T.right = (T.right||0) + 1; dingdong(); } saveStars();
  if (!T.right) T.right = 0;
  const n = T.mc.length + T.sa.length;
  const sp = document.getElementById('sprog'); if (sp) sp.textContent = `확인한 문항 ${T.checked.size} / ${n} · 맞힘 ${T.right}`;
}
function grade(){
  if (T.graded){ test(); window.scrollTo({top:0}); return; }
  const blank = T.mc.filter((q,k) => !main.querySelector(`input[name="m${k}"]:checked`)).length + T.sa.filter((q,k) => !document.getElementById('s'+k).value.trim()).length;
  const tr = document.getElementById('tres');
  if (blank && !tr.dataset.warned){ tr.dataset.warned = '1'; tr.innerHTML = `<p class="fb bad" style="text-align:center">아직 ${blank}문항을 풀지 않았습니다. 그대로 채점하려면 '${T.self ? '전체 정답 체크' : '정답 체크'}'를 한 번 더 누르세요.</p>`; return; }
  let ok = 0, okM = 0, okS = 0; const wrong = [];
  T.mc.forEach((q, k) => { if (markMC(k)){ ok++; okM++; } else wrong.push(q.x.w); });
  T.sa.forEach((q, k) => { if (markSA(k)){ ok++; okS++; } else wrong.push(q.x.w); });
  saveStars();
  const n = T.mc.length + T.sa.length, score = T.kind==='mini' ? ok * 5 : Math.round(ok / n * 100);
  if (ok) dingdong();
  T.graded = true;
  const parts = []; if (T.mc.length) parts.push(`객관식 ${okM}/${T.mc.length}`); if (T.sa.length) parts.push(`주관식 ${okS}/${T.sa.length}`);
  tr.innerHTML = `<div class="q tbig"><div class="count">${esc(tName || '이름 없음')} · WORD MASTER ${rangeName()} ${KIND_NAME[T.kind]}</div><div class="sc">${score}점</div>
    <div class="count">${n}문항 중 ${ok}문항 정답 · ${parts.join(' · ')}</div>
    ${wrong.length ? `<div class="miss" style="text-align:center">틀린 단어 ${wrong.length}개: ${wrong.map(w=>`<b style="font-family:var(--f-en)">${esc(w)}</b>`).join(', ')}<br><span class="count">틀린 단어는 ★로 표시했습니다. 단어장에서 ★ 표시만 골라 복습하세요.</span></div>` : '<div class="miss" style="text-align:center">모두 맞혔습니다!</div>'}</div>`;
  document.getElementById('tchk').textContent = '같은 시험지 다시 풀기';
  tr.scrollIntoView({behavior: 'smooth', block: 'center'});
}

/* 탭 */
let mode = 'list';
const starts = { list, card: cardStart, quiz: quizStart, ee: eeStart, spell: spellStart, self: () => { T = TS; T ? test() : testStart('self'); }, test: () => { T = TR; T ? test() : testStart('mcall'); } };
function go(m){ mode = m; document.body.classList.toggle('hideM', m==='list' && hideM); document.body.classList.toggle('hideW', m==='list' && hideW);
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.m === m)); starts[m](); store.set('mode', m);
  const bar = document.querySelector('.bar'), at = document.getElementById('t-'+m); if (bar && at && bar.scrollWidth > bar.clientWidth) bar.scrollLeft = at.offsetLeft - bar.offsetLeft - (bar.clientWidth - at.offsetWidth)/2; }
document.querySelectorAll('.tab').forEach(t => t.onclick = () => go(t.dataset.m));
/* DAY 범위 */
const DN = 50, pad = n => String(n).padStart(2,'0');
let dA = 1, dB = 1, dStep = 0; /* dStep 0: 다음 터치가 시작 DAY, 1: 다음 터치가 끝 DAY */
const dayb = document.getElementById('dayb'), dayp = document.getElementById('dayp'), dayg = document.getElementById('dayg');
dayg.innerHTML = Array.from({length:DN}, (_,k) => `<button type="button" data-day="${k+1}">${pad(k+1)}</button>`).join('');
function rangeName(){ return dA===dB ? 'DAY '+pad(dA) : `DAY ${pad(dA)}~${pad(dB)}`; }
function dayPaint(){
  document.getElementById('dayt').textContent = dA===dB ? 'DAY '+pad(dA) : `DAY ${pad(dA)} ~ ${pad(dB)}`;
  document.getElementById('dayh').textContent = dStep ? `끝 DAY를 누르세요. DAY ${pad(dA)} 하루만 공부하려면 '완료'를 누르세요.` : '시작 DAY를 누르세요.';
  dayg.querySelectorAll('button').forEach(b => { const n = +b.dataset.day; b.classList.toggle('in', n>=dA && n<=dB); b.classList.toggle('end', n===dA || n===dB); b.setAttribute('aria-pressed', n>=dA && n<=dB); });
}
function setRange(){
  W = ALLW.filter(x => { const n = +x.s.slice(4); return n>=dA && n<=dB; });
  E = W.map(x => DATA.E[x.i]);
  T = TS = TR = null; store.set('range', [dA,dB]);
  document.getElementById('dc').textContent = `${W.length}단어`;
  dayPaint();
}
function dayOpen(o){ dayp.hidden = !o; dayb.setAttribute('aria-expanded', o); if (o){ dStep = 0; dayPaint(); } }
{ let r = store.get('range', [1,1]); if (!Array.isArray(r) || !(r[0]>=1 && r[1]<=DN && r[0]<=r[1])) r = [1,1]; dA = r[0]; dB = r[1]; setRange(); }
dayb.onclick = () => dayOpen(dayp.hidden);
dayg.onclick = e => {
  const b = e.target.closest('[data-day]'); if (!b) return; const n = +b.dataset.day;
  if (!dStep){ dA = dB = n; dStep = 1; setRange(); go(mode); return; }
  dA = Math.min(dA, n); dB = Math.max(dB, n); setRange(); go(mode); dayOpen(false);
};
document.getElementById('daya').onclick = () => { dA = 1; dB = DN; setRange(); go(mode); dayOpen(false); };
document.getElementById('dayd').onclick = () => dayOpen(false);
const h0 = location.hash.slice(1);
go(starts[h0] ? h0 : (starts[store.get('mode','list')] ? store.get('mode','list') : 'list'));
</script>
